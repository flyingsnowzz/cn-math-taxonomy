name: Vue Web CI

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - '.github/workflows/web.yml'
      - 'data/**'
      - 'web/**'
  workflow_dispatch:

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-web:
    name: Lint, typecheck, unit tests, build and E2E
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build data packages and verify them
        run: npm run data:build && npm run data:verify

      - name: Production build
        run: npm run build

      - name: Install Google Chrome for Playwright
        run: npx playwright install --with-deps chrome

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report
          if-no-files-found: ignore
          retention-days: 7


  validate-legacy:
    name: Legacy data and deterministic engine regression
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate formal graph and question data
        run: python3 scripts/validate.py

      - name: Run legacy deterministic engine tests
        run: node tests/test_engine.js

      - name: Run legacy child profile tests
        run: node tests/test_children.js

      - name: Run legacy blindspot tests
        run: node tests/test_blindspots.js
